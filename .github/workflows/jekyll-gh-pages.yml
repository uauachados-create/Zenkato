name: Atualizar Vitrine Diariamente

on:
  schedule:
    # Roda todos os dias às 12:00 UTC (que corresponde às 09:00 no horário de Brasília)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite que você rode manualmente clicando em um botão para testar

jobs:
  atualizar-vitrine:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para o robô salvar o arquivo novo no repositório

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar o Garimpo de Produtos
        run: python gerador_vitrine.py

      - name: Salvar o novo JSON no site
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add vitrine_produtos.json
          git commit -m "Atualização diária automática da vitrine" || echo "Nenhuma mudança nos produtos de hoje"
          git push
